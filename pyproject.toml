[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "meetsub"
version = "1.1.0"
description = "Local real-time English-to-Chinese meeting subtitles for Windows"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "MeetSub" }]
dependencies = [
    "PySide6-Essentials>=6.7,<6.13",
    "faster-whisper>=1.1,<2",
    "ctranslate2>=4.4,<5",
    "tokenizers>=0.20,<1",
    "sentencepiece>=0.2,<1",
    "onnxruntime>=1.17,<2",
    "numpy>=1.26,<3",
    "httpx>=0.27,<1",
    "pyaudiowpatch>=0.2.12,<0.3",
    "webrtcvad-wheels>=2.0.14,<3",
    "soxr>=0.3,<2",
    "opencc-python-reimplemented>=0.1.7,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
build = ["pyinstaller>=6.10"]

[project.gui-scripts]
meetsub = "meetsub.main:main"

[tool.setuptools.packages.find]
include = ["meetsub*"]

[tool.ruff]
line-length = 112
target-version = "py310"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "B905", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: slow tests that require local model weights",
]
